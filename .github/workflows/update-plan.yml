name: Atualizar Plano SimBrief

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descarregar repositório
        uses: actions/checkout@v4

      - name: Obter dados do SimBrief (DownwindCargo540)
        run: |
          curl -s "https://www.simbrief.com/api/xml.fetch.php?username=DownwindCargo540&json=1" -o plano.json

      - name: Guardar alterações no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plano.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-atualizar plano de voo" && git push)
