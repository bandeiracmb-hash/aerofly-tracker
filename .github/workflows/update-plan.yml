name: "Atualizar Plano SimBrief"

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Descarregar repositório"
        uses: actions/checkout@v4

      - name: "Obter dados do SimBrief (ID: 1217985)"
        run: |
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://www.simbrief.com/api/v1/flightplan.json?userid=1217985" -o plano.json

      - name: "Guardar alterações no GitHub"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add plano.json
          git diff --staged --quiet || git commit -m "Auto-atualizar plano de voo"
          git push origin main || true
