name: "Atualizar Plano SimBrief"

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Descarregar repositório"
        uses: actions/checkout@v4

      - name: "Obter e converter dados do SimBrief (ID: 1217985)"
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          import json
          import urllib.request

          url = "https://www.simbrief.com/xml.fetch.php?userid=1217985"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          
          try:
              with urllib.request.urlopen(req) as response:
                  xml_data = response.read()
              
              root = ET.fromstring(xml_data)
              
              def xml_to_dict(elem):
                  d = {}
                  for child in elem:
                      if len(child):
                          child_val = xml_to_dict(child)
                      else:
                          child_val = child.text
                      if child.tag in d:
                          if not isinstance(d[child.tag], list):
                              d[child.tag] = [d[child.tag]]
                          d[child.tag].append(child_val)
                      else:
                          d[child.tag] = child_val
                  return d

              data = xml_to_dict(root)
              with open("plano.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
              print("Plano convertido com sucesso para JSON!")
          except Exception as e:
              print(f"Erro ao processar dados: {e}")
              exit(1)
          '

      - name: "Guardar alterações no GitHub"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add plano.json
          git diff --staged --quiet || git commit -m "Auto-atualizar plano de voo"
          git push origin main || true
